name: Build APK

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Liberar almacenamiento ──────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      # ── Swap 8 GB ───────────────────────────────────────────────────────────
      - name: Increase Swap Space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java & Node ─────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Cache Gradle ────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── ccache ──────────────────────────────────────────────────────────────
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-
          max-size: '2G'

      # ── Dependencias ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --prefer-offline

      # ── Android SDK / NDK ───────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses || true

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" --sdk_root=$ANDROID_SDK_ROOT || \
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "ndk;27.1.12297006" --sdk_root=$ANDROID_SDK_ROOT

      # ── Expo prebuild ───────────────────────────────────────────────────────
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      # ── Forzar SOLO arm64-v8a + ajustes de memoria ──────────────────────────
      - name: Configure gradle.properties
        run: |
          cat >> android/gradle.properties << 'PROPS'

          reactNativeArchitectures=arm64-v8a
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          kotlin.daemon.jvm.options=-Xmx2g
          PROPS

      # ── Build con debug signing (sin keystore propio) ────────────────────────
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --max-workers=2
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=512m"
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      # ── Subir APK ───────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-arm64-${{ github.ref_name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
